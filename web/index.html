<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDUVISE.AI</title>
  <link rel="icon" href="favicon.png">
  <link rel="manifest" href="manifest.json">

   <!-- Google Analytics -->
   <script async src="https://www.googletagmanager.com/gtag/js?id=G-23B2YYBTT6"></script>
   <script>
     window.dataLayer = window.dataLayer || [];
     function gtag(){dataLayer.push(arguments);}
     gtag('js', new Date());
     gtag('config', 'G-23B2YYBTT6'); // Replace with your Measurement ID
   </script>

  <!-- New Flutter 3.29+ Initialization Pattern -->
  <script>
    // Minimal required configuration
    window.flutterConfiguration = {
     assetBase: "/",// No trailing slash
      assets: ["assets/images"], 
      appId: 'eduvise_ai',
      entrypoint: 'main.dart.js',
      buildConfig: {
        // Will be merged with Flutter's generated config
      }
    };
  </script>

  <!-- Loader Script (MUST come after config) -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if ('serviceWorker' in navigator) {
        // Let Flutter handle service worker registration
        navigator.serviceWorker.register('flutter_service_worker.js')
          .catch(console.error);
      }

      // Modern initialization (Flutter 3.29+)
      _flutter.loader
        .loadEntrypoint({
          onEntrypointLoaded: async (engineInitializer) => {
            try {
              const appRunner = await engineInitializer.initializeEngine();
              await appRunner.runApp();
              document.getElementById('loading').style.display = 'none';
            } catch (error) {
              console.error('Flutter initialization failed:', error);
              document.getElementById('loading').innerHTML = 
                '<p>Application failed to load. Please refresh.</p>';
            }
          }
        });
    });
  </script>

  <!-- Loading Screen -->
  <div id="loading">
    Loading EDUVISE.AI...
  </div>
</body>
</html>
