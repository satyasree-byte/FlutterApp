<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDUVISE.AI | Educational Advice & AI Learning Consultation</title>
  <meta name="description" content="Eduvise.ai offers personalized educational advice and AI-powered career guidance. Book your consultation today to plan your academic or professional path with expert mentors.">
  <meta name="keywords" content="educational advice, education consultation, AI learning, career guidance, eduvise, eduvise.ai, study planning, online learning, study abroad, education counselor">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://eduvise.ai/">
  <link rel="icon" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Schema.org Structured Data for Educational Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "EducationalOrganization",
    "name": "Eduvise.ai",
    "url": "https://eduvise.ai",
    "logo": "https://eduvise.ai/assets/logo.png",
    "description": "Eduvise.ai offers educational advice, AI learning consultation, and career guidance for students and professionals.",
    "sameAs": [
      "https://www.linkedin.com/company/eduviseai",
      "https://twitter.com/eduviseai"
    ]
  }
  </script>
  <!-- New Flutter 3.29+ Initialization Pattern -->
  <script>
    // Minimal required configuration
    window.flutterConfiguration = {
     assetBase: "/",// No trailing slash
      assets: ["assets/images"], 
      appId: 'eduvise_ai',
      entrypoint: 'main.dart.js',
      buildConfig: {
        // Will be merged with Flutter's generated config
      }
    };
  </script>

  <!-- Loader Script (MUST come after config) -->
  <script src="flutter.js" defer></script>

  <!-- Loading Screen Styles -->
  <style>
    #loading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      color: #333;
      text-align: center;
    }

    #loading img {
      max-width: 200px;
      margin-bottom: 20px;
    }

    .spinner {
      margin: 20px auto;
      width: 40px;
      height: 40px;
      border: 5px solid #ccc;
      border-top-color: #1d72b8; /* Primary color */
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #loading p {
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if ('serviceWorker' in navigator) {
        // Let Flutter handle service worker registration
        navigator.serviceWorker.register('flutter_service_worker.js')
          .catch(console.error);
      }

      // Modern initialization (Flutter 3.29+)
      _flutter.loader
        .loadEntrypoint({
          onEntrypointLoaded: async (engineInitializer) => {
            try {
              const appRunner = await engineInitializer.initializeEngine();
              await appRunner.runApp();
              document.getElementById('loading').style.display = 'none';
            } catch (error) {
              console.error('Flutter initialization failed:', error);
              document.getElementById('loading').innerHTML = 
                '<p>Application failed to load. Please refresh.</p>';
            }
          }
        });
    });
  </script>

  <!-- Loading Screen -->
  <div id="loading" style="text-align:center; padding-top:100px;">
    <img src="assets/images/4.svg" alt="Eduvise.ai Logo" width="200">
    <p>Loading EDUVISE.AI...</p>
    <div class="spinner"></div>
    <p>Preparing your personalized educational advice...</p>
  </div>
</body>
</html>
